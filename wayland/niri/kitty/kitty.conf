# Eldritch
include current-theme.conf

# ─────────────────────────────────────────────
# Wayland
# ─────────────────────────────────────────────

# Fuerza a kitty a utilizar el backend nativo de Wayland.
# Evita que kitty utilice XWayland.
linux_display_server wayland

# ─────────────────────────────────────────────
# Fuente
# ─────────────────────────────────────────────

# Fuente principal.
font_family JetBrainsMono Nerd Font

# Fuente para texto en negrita.
bold_font JetBrainsMono Nerd Font Extra Bold

# Fuente para negrita + cursiva.
bold_italic_font JetBrainsMono Nerd Font Extra Bold Italic

# Tamaño de la fuente.
font_size 11.0

# ─────────────────────────────────────────────
# Tamaño de las celdas
# ─────────────────────────────────────────────

# Hace las celdas un poco más estrechas.
modify_font cell_width 95%

# Reduce la altura de cada celda.
modify_font cell_height 1px

# ─────────────────────────────────────────────
# Ventana
# ─────────────────────────────────────────────

# Margen externo de la ventana.
window_margin_width 4

# Sin padding interno.
window_padding_width 0

# Transparencia del fondo.
background_opacity 0.9

# ─────────────────────────────────────────────
# Portapapeles
# ─────────────────────────────────────────────

# Seleccionar texto automáticamente lo copia.
copy_on_select yes

# ─────────────────────────────────────────────
# Decoración
# ─────────────────────────────────────────────

# Oculta las decoraciones de la ventana.
hide_window_decorations yes

# ─────────────────────────────────────────────
# Tamaño inicial
# ─────────────────────────────────────────────

# No recuerda el tamaño anterior.
remember_window_size no

# 140 columnas inicialmente.
initial_window_width 140c

# 40 filas inicialmente.
initial_window_height 40c

# ─────────────────────────────────────────────
# Cursor
# ─────────────────────────────────────────────

cursor_trail 100
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2
cursor_shape underline
cursor_underline_thickness 2.0

# ─────────────────────────────────────────────
# URLs
# ─────────────────────────────────────────────

detect_urls yes
mouse_hide_wait 2.0

# ─────────────────────────────────────────────
# Editor
# ─────────────────────────────────────────────

editor nvim

# ─────────────────────────────────────────────
# Scrollback
# ─────────────────────────────────────────────

scrollback_lines 10000
